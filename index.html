<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip Expenses</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f8f7f4;--bg3:#f2f1ed;
  --text:#1a1a1a;--text2:#6b6b6b;
  --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.2);
  --radius:8px;--radius-lg:12px;
  --green:#1D9E75;--red:#A32D2D;--amber:#BA7517;--blue:#185FA5;
  --green-bg:#EAF3DE;--green-txt:#3B6D11;
  --red-bg:#FCEBEB;--red-txt:#791F1F;
  --amber-bg:#FAEEDA;--amber-txt:#633806;
  --blue-bg:#E6F1FB;--blue-txt:#0C447C;
  --gray-bg:#F1EFE8;--gray-txt:#444441;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;
  --text:#f2f2f7;--text2:#aeaeb2;
  --border:rgba(255,255,255,0.12);--border2:rgba(255,255,255,0.22);
  --green:#5DCAA5;--red:#F09595;--amber:#FAC775;--blue:#85B7EB;
  --green-bg:#085041;--green-txt:#9FE1CB;
  --red-bg:#791F1F;--red-txt:#F7C1C1;
  --amber-bg:#633806;--amber-txt:#FAC775;
  --blue-bg:#0C447C;--blue-txt:#B5D4F4;
  --gray-bg:#444441;--gray-txt:#D3D1C7;
}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);min-height:100vh;font-size:15px}
.app{max-width:700px;margin:0 auto;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;box-shadow:0 0 0 0.5px var(--border)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:0.5px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:10;gap:10px;flex-wrap:wrap}
.trip-name{font-size:16px;font-weight:600}
.trip-sub{font-size:12px;color:var(--text2);margin-top:1px}
.topbar-actions{display:flex;gap:6px;flex-wrap:wrap}
.nav{display:flex;gap:3px;padding:10px 14px;border-bottom:0.5px solid var(--border);background:var(--bg2);overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-btn{padding:6px 12px;border-radius:var(--radius);font-size:13px;border:0.5px solid transparent;cursor:pointer;background:transparent;color:var(--text2);white-space:nowrap;display:flex;align-items:center;gap:5px}
.nav-btn.active{background:var(--bg);border-color:var(--border2);color:var(--text);font-weight:500}
.content{flex:1;padding:18px}
.page{display:none}.page.active{display:block}
.section-title{font-size:15px;font-weight:600;margin-bottom:14px}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:15px 17px;margin-bottom:11px}
.card-click{cursor:pointer}.card-click:hover{background:var(--bg2)}
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
@media(min-width:480px){.metric-grid{grid-template-columns:repeat(4,1fr)}}
.metric{background:var(--bg2);border-radius:var(--radius);padding:12px 14px}
.metric-label{font-size:12px;color:var(--text2);margin-bottom:4px}
.metric-val{font-size:21px;font-weight:600}
.metric-val.green{color:var(--green)}.metric-val.red{color:var(--red)}.metric-val.amber{color:var(--amber)}
.btn{padding:8px 15px;border-radius:var(--radius);font-size:13px;border:0.5px solid var(--border2);cursor:pointer;background:transparent;color:var(--text);display:inline-flex;align-items:center;gap:6px;font-family:inherit;text-decoration:none}
.btn:hover{background:var(--bg2)}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.success{background:var(--green);color:#fff;border-color:var(--green)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.wide{width:100%;justify-content:center}
.form-group{margin-bottom:14px}
label{font-size:13px;color:var(--text2);display:block;margin-bottom:5px}
input,select,textarea{width:100%;padding:9px 11px;border:0.5px solid var(--border2);border-radius:var(--radius);font-size:14px;background:var(--bg);color:var(--text);font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
textarea{resize:vertical;min-height:64px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.flex-row{display:flex;align-items:center;gap:10px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.badge.green{background:var(--green-bg);color:var(--green-txt)}
.badge.red{background:var(--red-bg);color:var(--red-txt)}
.badge.amber{background:var(--amber-bg);color:var(--amber-txt)}
.badge.blue{background:var(--blue-bg);color:var(--blue-txt)}
.badge.gray{background:var(--gray-bg);color:var(--gray-txt)}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
hr{border:none;border-top:0.5px solid var(--border);margin:14px 0}
.empty{text-align:center;padding:48px 20px;color:var(--text2);font-size:14px;line-height:1.8}
.empty i{font-size:36px;display:block;margin-bottom:10px;opacity:0.4}
.progress-bar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:5px}
.progress-fill{height:100%;background:var(--green);border-radius:3px}
.split-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:0.5px solid var(--border)}
.split-item:last-child{border-bottom:none}
.chk-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:0.5px solid var(--border)}
.chk-row:last-child{border-bottom:none}
.chk-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--blue);flex-shrink:0;cursor:pointer}
.chk-row label{margin:0;font-size:14px;color:var(--text);cursor:pointer}
.cat-icon{width:48px;height:48px;border-radius:var(--radius);background:var(--bg2);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:20px;flex-shrink:0}
.agg-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:0.5px solid var(--border);font-size:13px}
.agg-row:last-child{border-bottom:none}
.tab-row{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:6px 13px;border-radius:var(--radius);font-size:13px;border:0.5px solid var(--border);cursor:pointer;background:transparent;color:var(--text2);font-family:inherit}
.tab.active{background:var(--bg);color:var(--text);border-color:var(--border2);font-weight:500}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:flex-end;justify-content:center;z-index:100}
@media(min-width:520px){.overlay{align-items:center;padding:20px}}
.modal{background:var(--bg);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:22px 20px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
@media(min-width:520px){.modal{border-radius:var(--radius-lg)}}
.modal-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 18px}
.modal-title{font-size:16px;font-weight:600;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.chase-box{background:var(--bg2);border-radius:var(--radius);padding:13px;font-size:12px;line-height:1.7;white-space:pre-wrap;font-family:'Courier New',monospace;color:var(--text);border:0.5px solid var(--border)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1c1c1e;color:#fff;padding:10px 20px;border-radius:var(--radius-lg);font-size:13px;z-index:200;opacity:0;transition:opacity 0.25s;pointer-events:none}
.toast.show{opacity:1}
.sync-bar{display:flex;align-items:center;gap:8px;padding:7px 14px;font-size:12px;color:var(--text2);border-bottom:0.5px solid var(--border);background:var(--bg2)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0}
.sync-dot.busy{background:var(--amber);animation:pulse 1s infinite}
.sync-dot.err{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.spinner-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:14px;color:var(--text2);font-size:14px}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.member-meta{font-size:12px;color:var(--text2);margin-top:3px;display:flex;gap:12px;flex-wrap:wrap}
.info-box{border-radius:var(--radius);padding:10px 12px;font-size:12px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.info-box.blue{background:var(--blue-bg);color:var(--blue-txt)}
.info-box.amber{background:var(--amber-bg);color:var(--amber-txt)}
</style>
</head>
<body>
<div class="app">

<div class="sync-bar" id="syncBar" style="display:none">
  <div class="sync-dot" id="syncDot"></div>
  <span id="syncLabel">Connected</span>
  <button class="btn sm" style="margin-left:auto" onclick="refreshData()"><i class="ti ti-refresh"></i> Refresh</button>
</div>

<div class="topbar" id="topbar" style="display:none">
  <div>
    <div class="trip-name" id="topbarName"></div>
    <div class="trip-sub" id="topbarSub"></div>
  </div>
  <div class="topbar-actions">
    <button class="btn sm" onclick="openTripsModal()"><i class="ti ti-map-2"></i> Trips</button>
    <button class="btn sm" onclick="openFxModal()"><i class="ti ti-arrows-exchange"></i> Rates</button>
    <button class="btn sm" onclick="openSettingsModal()"><i class="ti ti-settings"></i></button>
  </div>
</div>

<nav class="nav" id="mainNav" style="display:none">
  <button class="nav-btn" id="nb-dashboard" onclick="showPage('dashboard')"><i class="ti ti-layout-dashboard"></i> Dashboard</button>
  <button class="nav-btn" id="nb-expenses" onclick="showPage('expenses')"><i class="ti ti-receipt"></i> Expenses</button>
  <button class="nav-btn" id="nb-balances" onclick="showPage('balances')"><i class="ti ti-scale"></i> Balances</button>
  <button class="nav-btn" id="nb-members" onclick="showPage('members')"><i class="ti ti-users"></i> Members</button>
  <button class="nav-btn" id="nb-summary" onclick="showPage('summary')"><i class="ti ti-chart-bar"></i> Summary</button>
  <button class="nav-btn" id="nb-chase" onclick="showPage('chase')"><i class="ti ti-bell"></i> Chase</button>
</nav>

<div class="content">

<div class="page" id="page-setup">
  <div style="max-width:440px;margin:0 auto;padding-top:24px">
    <div style="text-align:center;margin-bottom:28px">
      <i class="ti ti-map-pin" style="font-size:42px;color:var(--blue);display:block;margin-bottom:10px"></i>
      <div style="font-size:20px;font-weight:600;margin-bottom:6px">Group Trip Expenses</div>
      <div style="font-size:14px;color:var(--text2)">All data syncs live — no file sharing needed</div>
    </div>
    <div class="card">
      <div class="form-group"><label>Trip name</label><input id="sName" placeholder="e.g. Ibiza Summer 2026"></div>
      <div class="row2">
        <div class="form-group"><label>Start date</label><input type="date" id="sStart"></div>
        <div class="form-group"><label>End date</label><input type="date" id="sEnd"></div>
      </div>
      <div class="form-group"><label>Destination</label><input id="sDest" placeholder="e.g. Ibiza, Spain"></div>
      <div class="form-group"><label>Base currency</label>
        <select id="sCurrency">
          <option value="GBP">GBP £ — British Pound</option>
          <option value="EUR">EUR € — Euro</option>
          <option value="USD">USD $ — US Dollar</option>
          <option value="COP">COP — Colombian Peso</option>
          <option value="AED">AED — UAE Dirham</option>
          <option value="ZAR">ZAR R — South African Rand</option>
          <option value="TRY">TRY ₺ — Turkish Lira</option>
          <option value="THB">THB ฿ — Thai Baht</option>
          <option value="AUD">AUD — Australian Dollar</option>
          <option value="CAD">CAD — Canadian Dollar</option>
        </select>
      </div>
      <hr>
      <div style="font-size:13px;font-weight:600;margin-bottom:12px">Your details (trip creator)</div>
      <div class="form-group"><label>Full name</label><input id="sYourName" placeholder="Your name"></div>
      <div class="form-group"><label>Email</label><input type="email" id="sYourEmail" placeholder="you@email.com"></div>
      <div class="form-group"><label>WhatsApp</label><input id="sYourWa" placeholder="+44 7700 000000"></div>
      <button class="btn primary wide" onclick="createTrip()"><i class="ti ti-arrow-right"></i> Create trip &amp; sync to cloud</button>
      <hr>
      <div style="text-align:center;font-size:13px;color:var(--text2);margin-bottom:10px">Joining an existing trip?</div>
      <div class="flex-row" style="gap:8px">
        <input id="joinCode" placeholder="Paste trip ID here..." style="flex:1">
        <button class="btn primary" onclick="joinByCode()"><i class="ti ti-login"></i> Join</button>
      </div>
    </div>
  </div>
</div>

<div class="page" id="page-loader">
  <div class="spinner-wrap"><div class="spinner"></div>Loading trip data...</div>
</div>

<div class="page" id="page-dashboard">
  <div class="metric-grid" id="dbMetrics"></div>
  <div class="row-between" style="margin-bottom:14px">
    <div class="section-title" style="margin-bottom:0">Recent expenses</div>
    <button class="btn sm primary" onclick="openExpenseModal(null)"><i class="ti ti-plus"></i> Add</button>
  </div>
  <div id="dbRecent"></div>
  <div class="section-title" style="margin-top:22px;margin-bottom:14px">Per-person snapshot</div>
  <div id="dbPersons"></div>
</div>

<div class="page" id="page-expenses">
  <div class="row-between" style="margin-bottom:14px">
    <div class="section-title" style="margin-bottom:0">All expenses</div>
    <button class="btn sm primary" onclick="openExpenseModal(null)"><i class="ti ti-plus"></i> Add</button>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
    <select id="fCat" onchange="renderExpenses()" style="width:auto;font-size:12px;padding:6px 9px">
      <option value="">All categories</option>
      <option>Food &amp; drink</option><option>Accommodation</option><option>Transport</option>
      <option>Activities</option><option>Shopping</option><option>Other</option>
    </select>
    <select id="fStatus" onchange="renderExpenses()" style="width:auto;font-size:12px;padding:6px 9px">
      <option value="">All statuses</option>
      <option value="open">Has outstanding</option>
      <option value="settled">Fully settled</option>
    </select>
  </div>
  <div id="expensesList"></div>
</div>

<div class="page" id="page-balances">
  <div class="section-title">Who owes what</div>
  <div id="balancesList"></div>
</div>

<div class="page" id="page-members">
  <div class="row-between" style="margin-bottom:14px">
    <div class="section-title" style="margin-bottom:0">Members</div>
    <button class="btn sm primary" onclick="openMemberModal(null)"><i class="ti ti-plus"></i> Add</button>
  </div>
  <div id="membersList"></div>
</div>

<div class="page" id="page-summary">
  <div class="section-title">Trip summary</div>
  <div class="tab-row">
    <button class="tab active" id="tab-person" onclick="setAggTab('person')">By person</button>
    <button class="tab" id="tab-category" onclick="setAggTab('category')">By category</button>
    <button class="tab" id="tab-location" onclick="setAggTab('location')">By location</button>
    <button class="tab" id="tab-date" onclick="setAggTab('date')">By date</button>
  </div>
  <div id="aggContent"></div>
</div>

<div class="page" id="page-chase">
  <div class="section-title">Chase unpaid members</div>
  <div id="chaseList"></div>
</div>

</div><!-- /content -->
</div><!-- /app -->

<!-- MODALS (shown/hidden via JS, no onclick in HTML attributes with string args) -->
<div class="overlay" id="overlay" style="display:none" onclick="overlayClick(event)">
  <div class="modal" id="modalInner"></div>
</div>

<div class="toast" id="toast"></div>
<script>
// =============================================================================
// CONFIG
// =============================================================================
const SB_URL = 'https://bfwkwvsmrqvnmiolhlqy.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmd2t3dnNtcnF2bm1pb2xobHF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NTI2MzAsImV4cCI6MjA5NjMyODYzMH0.O3Jalw7WFxLY_nbZnHZUgKdXBNgrqaGw460xbTlB6-I';

// =============================================================================
// CONSTANTS
// =============================================================================
const AVATARBG  = ['#E6F1FB','#E1F5EE','#FAEEDA','#FCEBEB','#EEEDFE','#FBEAF0','#d4f1e4','#F1EFE8'];
const AVATARTXT = ['#0C447C','#085041','#633806','#791F1F','#3C3489','#72243E','#0F6E56','#444441'];
const CATICON = {'Food & drink':'ti-tools-kitchen-2','Accommodation':'ti-building','Transport':'ti-car','Activities':'ti-ticket','Shopping':'ti-shopping-bag','Other':'ti-dots'};
const SYMS = {GBP:'£',EUR:'€',USD:'$',COP:'COP$',AED:'AED',ZAR:'R',TRY:'₺',THB:'฿',AUD:'A$',CAD:'C$'};
const CURNAMES = {GBP:'British Pound',EUR:'Euro',USD:'US Dollar',COP:'Colombian Peso',AED:'UAE Dirham',ZAR:'South African Rand',TRY:'Turkish Lira',THB:'Thai Baht',AUD:'Australian Dollar',CAD:'Canadian Dollar'};
const DEF_RATES = {GBP:1,EUR:1.17,USD:1.27,COP:5200,AED:4.66,ZAR:23.5,TRY:40.8,THB:44.5,AUD:1.97,CAD:1.74};
const CURRENCIES = ['GBP','EUR','USD','COP','AED','ZAR','TRY','THB','AUD','CAD'];

// =============================================================================
// STATE
// =============================================================================
let T = null;          // current trip object
let MEMBERS = [];      // current trip members
let EXPENSES = [];     // current trip expenses
let FX = {};           // fx rates: 1 base = X foreign
let AGG_TAB = 'person';
let CUR_EXP_ID = null;
let ALL_TRIPS = [];    // local list [{id,name,destination,currency}]

// =============================================================================
// UTILS
// =============================================================================
const $ = id => document.getElementById(id);
const base = () => T ? T.currency : 'GBP';
const sym  = c => SYMS[c || base()] || c || '£';
const uid  = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
const inits = n => n.trim().split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0,2);
const getMember = id => MEMBERS.find(m => m.id === id) || {name:'Unknown'};
const getMIdx   = id => MEMBERS.findIndex(m => m.id === id);

function toBase(amount, cur) {
  if (!cur || cur === base()) return amount;
  const r = FX[cur];
  return (r && r > 0) ? amount / r : amount;
}
function fmtBase(n) {
  n = Number(n);
  if (base() === 'COP') return sym() + ' ' + Math.round(n).toLocaleString();
  return sym() + n.toFixed(2);
}
function fmtFgn(n, cur) {
  n = Number(n);
  if (cur === 'COP') return sym(cur) + ' ' + Math.round(n).toLocaleString();
  return sym(cur) + n.toFixed(2);
}
function initFx() {
  const b = base();
  CURRENCIES.forEach(c => {
    if (c === b) { FX[b] = 1; return; }
    if (!FX[c]) FX[c] = parseFloat(((DEF_RATES[c] || 1) / (DEF_RATES[b] || 1)).toFixed(4));
  });
}
function avatar(name, idx, size) {
  size = size || 32;
  const i = ((idx >= 0 ? idx : 0) % 8);
  return '<div class="avatar" style="width:' + size + 'px;height:' + size + 'px;min-width:' + size + 'px;background:' + AVATARBG[i] + ';color:' + AVATARTXT[i] + ';font-size:' + (size > 30 ? 13 : 10) + 'px">' + inits(name) + '</div>';
}

// =============================================================================
// TOAST / SYNC
// =============================================================================
function toast(msg, dur) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur || 2500);
}
function setSyncing(state, msg) {
  const dot = $('syncDot'), lbl = $('syncLabel');
  if (!dot) return;
  dot.className = 'sync-dot' + (state === 'busy' ? ' busy' : state === 'err' ? ' err' : '');
  lbl.textContent = msg || (state === 'busy' ? 'Saving...' : state === 'err' ? 'Connection error' : 'Connected — live sync');
}

// =============================================================================
// SUPABASE API
// =============================================================================
async function sbReq(method, table, body, qs) {
  let url = SB_URL + '/rest/v1/' + table;
  if (qs) url += '?' + new URLSearchParams(qs);
  const headers = {
    'apikey': SB_KEY,
    'Authorization': 'Bearer ' + SB_KEY,
    'Content-Type': 'application/json',
    'Accept': 'application/json'
  };
  if (method === 'POST' || method === 'GET') headers['Prefer'] = 'return=representation';
  const opts = { method: method, headers: headers };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  const text = await res.text();
  if (!res.ok) throw new Error(table + ' ' + method + ': ' + text);
  return text ? JSON.parse(text) : null;
}
const dbGet    = (t, qs)   => sbReq('GET',    t, null, qs);
const dbPost   = (t, body) => sbReq('POST',   t, body);
const dbPatch  = (t, body, qs) => sbReq('PATCH', t, body, qs);
const dbDelete = (t, qs)   => sbReq('DELETE', t, null, qs);

// =============================================================================
// LOCAL STORAGE (just trip list + current id)
// =============================================================================
function saveLocal() {

// =============================================================================
// LOAD TRIP FROM SUPABASE
// =============================================================================
async function loadTrip(tripId) {
  showPage('loader');
  setSyncing('busy', 'Loading trip...');
  try {
    const rows = await dbGet('trips', {id: 'eq.' + tripId});
    if (!rows || !rows.length) { toast('Trip not found'); showPage('setup'); return; }
    const r = rows[0];
    T = { id: r.id, name: r.name, destination: r.destination || '', start: r.start_date || '', end: r.end_date || '', currency: r.currency || 'GBP' };
    FX = r.fx_rates || {};
    initFx();
    const [mRows, eRows] = await Promise.all([
      dbGet('members', {trip_id: 'eq.' + tripId, order: 'created_at.asc'}),
      dbGet('expenses', {trip_id: 'eq.' + tripId, order: 'created_at.desc'})
    ]);
    MEMBERS  = (mRows || []).map(rowToMember);
    EXPENSES = (eRows || []).map(rowToExpense);
    if (!ALL_TRIPS.find(x => x.id === tripId)) {
      ALL_TRIPS.unshift({id: T.id, name: T.name, destination: T.destination, currency: T.currency});
    }
    saveLocal();
    setSyncing('ok');
    initAppUI();
  } catch(e) {
    console.error(e);
    setSyncing('err');
    toast('Could not load trip — check connection');
    showPage('setup');
  }
}

async function refreshData() {
  if (T) await loadTrip(T.id);
}

// =============================================================================
// ROW MAPPERS
// =============================================================================
function rowToMember(r) {
  return {id: r.id, name: r.name, email: r.email || '', wa: r.whatsapp || '', role: r.role || 'member'};
}
function rowToExpense(r) {
  return {
    id: r.id, desc: r.description, amount: +r.amount,
    origAmount: +(r.original_amount || r.amount),
    origCur: r.original_currency || base(),
    fxUsed: +(r.fx_rate_used || 1),
    category: r.category || 'Other', date: r.date || '',
    location: r.location || '', paidBy: r.paid_by,
    splits: r.splits || {}, notes: r.notes || '',
    createdAt: new Date(r.created_at).getTime()
  };
}

async function createTrip() {
  const name    = $('sName').value.trim();
  const myName  = $('sYourName').value.trim();
  if (!name || !myName) { alert('Please enter a trip name and your name.'); return; }
  setSyncing('busy', 'Creating trip...');
  const tripId = uid();
  const memberId = uid();
  FX = {}; T = { id: tripId, name: name, destination: $('sDest').value.trim(), start: $('sStart').value, end: $('sEnd').value, currency: $('sCurrency').value };
  initFx();
  try {
    await dbPost('trips', {id: tripId, name: name, destination: T.destination, start_date: T.start, end_date: T.end, currency: T.currency, fx_rates: FX});
    await dbPost('members', {id: memberId, trip_id: tripId, name: myName, email: $('sYourEmail').value.trim(), whatsapp: $('sYourWa').value.trim(), role: 'admin'});
    MEMBERS = [{id: memberId, name: myName, email: $('sYourEmail').value.trim(), wa: $('sYourWa').value.trim(), role: 'admin'}];
    EXPENSES = [];
    ALL_TRIPS.unshift({id: tripId, name: name, destination: T.destination, currency: T.currency});
    saveLocal();
    setSyncing('ok');
    initAppUI();
    toast('Trip created!');
  } catch(e) {
    console.error(e);
    setSyncing('err');
    alert('Could not create trip: ' + e.message);

  });

    await dbPatch('trips', {fx_rates: FX}, {id: 'eq.' + T.id});
    setSyncing('ok'); closeModal(); toast('Rates saved!');

function updateFxPreview() {
  const amount = parseFloat($('aeAmount') ? $('aeAmount').value : 0);
  const cur    = $('aeCurrency') ? $('aeCurrency').value : base();
  const box    = $('fxPreview');
  if (!box) return;
  if (!cur || cur === base() || isNaN(amount) || amount <= 0) { box.style.display = 'none'; return; }
  const rate = FX[cur];
  if (!rate) { box.style.display = 'none'; return; }
  box.style.display = 'flex';
  box.querySelector('span').textContent = fmtFgn(amount, cur) + ' = ' + fmtBase(toBase(amount, cur)) + '   (1 ' + base() + ' = ' + rate.toFixed(2) + ' ' + cur + ')';
}

async function saveExpense(editId) {
  const desc      = $('aeDesc').value.trim();
  const rawAmount = parseFloat($('aeAmount').value);
  const inputCur  = $('aeCurrency').value;
  if (!desc || isNaN(rawAmount) || rawAmount <= 0) { alert('Please enter a description and valid amount.'); return; }
  const splitIds = Array.from(document.querySelectorAll('.chk-row input[type=checkbox]:checked')).map(c => c.value);
  if (!splitIds.length) { alert('Select at least one person to split with.'); return; }
  const amountBase = toBase(rawAmount, inputCur);
  const per = amountBase / splitIds.length;
  const paidBy = $('aePaidBy').value;
  const splits = {};
  if (editId) {
    const existing = EXPENSES.find(e => e.id === editId);
    splitIds.forEach(id => { splits[id] = {owed: per, paid: (existing && existing.splits[id] ? existing.splits[id].paid : false)}; });
  } else {
    splitIds.forEach(id => { splits[id] = {owed: per, paid: false}; });
  }
  if (splits[paidBy]) splits[paidBy].paid = true;

  const dbRow = {
    trip_id: T.id, description: desc,
    amount: amountBase, original_amount: rawAmount, original_currency: inputCur,
    fx_rate_used: inputCur === base() ? 1 : (FX[inputCur] || 1),
    category: $('aeCat').value, date: $('aeDate').value,
    location: $('aeLoc').value.trim(), paid_by: paidBy, splits: splits,
    notes: $('aeNotes').value.trim()
  };

  setSyncing('busy');
  try {
    if (editId) {
      await dbPatch('expenses', dbRow, {id: 'eq.' + editId});
      const idx = EXPENSES.findIndex(e => e.id === editId);
      if (idx >= 0) EXPENSES[idx] = rowToExpense(Object.assign({id: editId, created_at: new Date().toISOString()}, dbRow));
      toast('Expense updated.');
    } else {
      const newId = uid();
      dbRow.id = newId;
      await dbPost('expenses', dbRow);
      EXPENSES.unshift(rowToExpense(Object.assign({created_at: new Date().toISOString()}, dbRow)));
      toast('Expense added.');
    }
    setSyncing('ok'); closeModal(); renderDashboard(); renderExpenses();
  } catch(e) { setSyncing('err'); toast('Save failed: ' + e.message); }
}

async function deleteExpense() {
  if (!confirm('Delete this expense?')) return;
  setSyncing('busy');
  try {
    await dbDelete('expenses', {id: 'eq.' + CUR_EXP_ID});
    EXPENSES = EXPENSES.filter(e => e.id !== CUR_EXP_ID);
    setSyncing('ok'); closeModal(); renderDashboard(); renderExpenses(); toast('Deleted.');
  } catch(e) { setSyncing('err'); toast('Delete failed'); }
}

async function togglePaid(expId, memberId) {
  const exp = EXPENSES.find(e => e.id === expId);
  if (!exp || !exp.splits[memberId]) return;
  exp.splits[memberId].paid = !exp.splits[memberId].paid;
  setSyncing('busy');
  try {
    await dbPatch('expenses', {splits: exp.splits}, {id: 'eq.' + expId});
    setSyncing('ok'); showExpDetail(expId); renderDashboard(); renderExpenses(); renderChase();
    toast(exp.splits[memberId].paid ? 'Marked paid.' : 'Marked unpaid.');
  } catch(e) {
    exp.splits[memberId].paid = !exp.splits[memberId].paid;
    setSyncing('err'); toast('Update failed');
  }
}

    : '';
  return '<div class="card card-click" onclick="showExpDetail(\'' + exp.id + '\')">' +
    '<div class="row-between"><div class="flex-row" style="gap:11px">' +
    '<div class="cat-icon"><i class="ti ' + (CATICON[exp.category] || 'ti-receipt') + '"></i></div>' +
    '<div><div style="font-weight:600;margin-bottom:2px">' + esc(exp.desc) + '</div>' +
    '<div style="font-size:12px;color:var(--text2)">' + [exp.date, exp.location, exp.category].filter(Boolean).join(' · ') + '</div>' +
    '<div style="font-size:12px;color:var(--text2)">Paid by ' + esc(payer.name) + ' · ' + n + ' way' + (n !== 1 ? 's' : '') + '</div>' +
    fxLine + '</div></div>' +
    '<div style="text-align:right;flex-shrink:0;margin-left:8px">' +
    '<div style="font-size:16px;font-weight:600">' + fmtBase(exp.amount) + '</div>' +
    '<span class="badge ' + (done ? 'green' : 'amber') + '">' + (done ? 'Settled' : unpaid + ' pending') + '</span>' +
    '</div></div></div>';
}

function showExpDetail(id) {
  CUR_EXP_ID = id;
  const exp = EXPENSES.find(e => e.id === id); if (!exp) return;
  const payer = getMember(exp.paidBy);
  const fxInfo = (exp.origCur && exp.origCur !== base())
    ? '<div class="info-box blue"><i class="ti ti-arrows-exchange"></i>Originally ' + fmtFgn(exp.origAmount, exp.origCur) + ' at 1 ' + base() + ' = ' + exp.fxUsed.toFixed(2) + ' ' + exp.origCur + '</div>'
    : '';
  const lines = Object.entries(exp.splits).map(([mid, s]) => {
    const mb = getMember(mid); const isPayer = mid === exp.paidBy;
    return '<div class="split-item">' +
      '<div class="flex-row" style="gap:8px">' + avatar(mb.name, getMIdx(mid)) + '<span>' + esc(mb.name) + (isPayer ? ' <span class="badge gray" style="font-size:10px">payer</span>' : '') + '</span></div>' +
      '<div class="flex-row" style="gap:8px"><span style="font-weight:600">' + fmtBase(s.owed) + '</span>' +
      (!isPayer
        ? '<button class="btn sm ' + (s.paid ? '' : 'success') + '" onclick="togglePaid(\'' + id + '\',\'' + mid + '\')">' + (s.paid ? '<i class="ti ti-x"></i> Unpay' : '<i class="ti ti-check"></i> Paid') + '</button>'
        : '<span class="badge blue">Payer</span>') +
      '</div></div>';
  }).join('');
  const notes = exp.notes ? '<div style="font-size:13px;color:var(--text2);margin-bottom:14px;font-style:italic;padding:10px;background:var(--bg2);border-radius:var(--radius)">' + esc(exp.notes) + '</div>' : '';
  showModal(
    '<div class="modal-handle"></div>' +
    '<div class="modal-title">' + esc(exp.desc) + '</div>' +
    '<div class="row-between" style="margin-bottom:12px">' +
    '<div><div style="font-size:24px;font-weight:700">' + fmtBase(exp.amount) + '</div><div style="font-size:12px;color:var(--text2)">' + exp.category + '</div></div>' +
    '<div style="text-align:right"><div style="font-size:13px">Paid by <strong>' + esc(payer.name) + '</strong></div><div style="font-size:12px;color:var(--text2)">' + [exp.date, exp.location].filter(Boolean).join(' · ') + '</div></div>' +
    '</div>' + fxInfo + notes +
    '<div style="font-size:13px;font-weight:600;margin-bottom:6px">Split breakdown</div>' + lines +
    '<div class="flex-row" style="justify-content:flex-end;gap:8px;margin-top:14px">' +
    '<button class="btn danger sm" onclick="deleteExpense()"><i class="ti ti-trash"></i> Delete</button>' +
    '<button class="btn sm" onclick="openExpenseModal(\'' + id + '\')">' + '<i class="ti ti-edit"></i> Edit</button>' +
    '<button class="btn sm" onclick="closeModal()">Close</button></div>'
  );
}

// =============================================================================
// TOTALS
// =============================================================================
function calcTotals() {
  let total = 0, outstanding = 0;
  const po = {};
  MEMBERS.forEach(m => { po[m.id] = {owed: 0, paid: 0, expenses: []}; });
  EXPENSES.forEach(exp => {
    total += exp.amount;
    Object.entries(exp.splits).forEach(([id, s]) => {
      if (id === exp.paidBy) return;
      if (!po[id]) po[id] = {owed: 0, paid: 0, expenses: []};
      po[id].owed += s.owed;
      po[id].expenses.push({desc: exp.desc, amount: s.owed, paid: s.paid});
      if (s.paid) po[id].paid += s.owed; else outstanding += s.owed;
    });
  });
  return {total, outstanding, po};
}

// =============================================================================
// RENDER PAGES
// =============================================================================
function renderExpenses() {
  const cat = $('fCat').value, st = $('fStatus').value;
  let exps = EXPENSES.slice();
  if (cat) exps = exps.filter(e => e.category === cat);
  if (st === 'open')    exps = exps.filter(e => Object.values(e.splits).some(s => !s.paid));
  if (st === 'settled') exps = exps.filter(e => Object.values(e.splits).every(s => s.paid));
  $('expensesList').innerHTML = exps.length ? exps.map(expCard).join('') : '<div class="empty"><i class="ti ti-receipt"></i>No expenses match</div>';
}

function renderDashboard() {
  const {total, outstanding, po} = calcTotals();
  const pct = total > 0 ? Math.round(((total - outstanding) / total) * 100) : 0;
  $('dbMetrics').innerHTML =
    '<div class="metric"><div class="metric-label">Total spent</div><div class="metric-val">' + fmtBase(total) + '</div></div>' +
    '<div class="metric"><div class="metric-label">Outstanding</div><div class="metric-val red">' + fmtBase(outstanding) + '</div></div>' +
    '<div class="metric"><div class="metric-label">Settled</div><div class="metric-val green">' + fmtBase(total - outstanding) + '</div></div>' +
    '<div class="metric"><div class="metric-label">% settled</div><div class="metric-val ' + (pct >= 75 ? 'green' : pct >= 40 ? 'amber' : 'red') + '">' + pct + '%</div>' +
    '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div></div>';
  $('dbRecent').innerHTML = EXPENSES.slice(0, 4).map(expCard).join('') || '<div class="empty"><i class="ti ti-receipt"></i>No expenses yet — tap Add!</div>';
  $('dbPersons').innerHTML = MEMBERS.map((m, i) => {
    const p = po[m.id] || {owed: 0, paid: 0}; const ow = p.owed - p.paid;
    return '<div class="card"><div class="row-between">' +
      '<div class="flex-row" style="gap:10px">' + avatar(m.name, i) + '<div><div style="font-weight:600">' + esc(m.name) + '</div><div style="font-size:12px;color:var(--text2)">' + m.role + '</div></div></div>' +
      '<div style="text-align:right"><div style="font-weight:600;color:' + (ow > 0.005 ? 'var(--red)' : 'var(--green)') + '">' + (ow > 0.005 ? fmtBase(ow) + ' owed' : 'All settled') + '</div>' +
      '<div style="font-size:12px;color:var(--text2)">' + fmtBase(p.owed) + ' total share</div></div>' +
      '</div></div>';
  }).join('');
}

function renderBalances() {
  const {po} = calcTotals();
  $('balancesList').innerHTML = MEMBERS.map((m, i) => {
    const p = po[m.id] || {owed: 0, paid: 0, expenses: []}; const ow = p.owed - p.paid;
    const items = (p.expenses || []).filter(e => !e.paid && e.amount > 0);
    return '<div class="card">' +
      '<div class="row-between" style="margin-bottom:' + (items.length ? 10 : 0) + 'px">' +
      '<div class="flex-row" style="gap:10px">' + avatar(m.name, i, 38) + '<div><div style="font-weight:600">' + esc(m.name) + '</div><div style="font-size:12px;color:var(--text2)">' + items.length + ' outstanding</div></div></div>' +
      '<div style="font-size:20px;font-weight:700;color:' + (ow > 0.005 ? 'var(--red)' : 'var(--green)') + '">' + (ow > 0.005 ? fmtBase(ow) : 'Settled') + '</div>' +
      '</div>' +
      (items.length ? '<div style="border-top:0.5px solid var(--border);padding-top:8px">' + items.map(e => '<div class="agg-row"><span style="color:var(--text2)">' + esc(e.desc) + '</span><span style="font-weight:600">' + fmtBase(e.amount) + '</span></div>').join('') + '</div>' : '') +
      '</div>';
  }).join('') || '<div class="empty"><i class="ti ti-users"></i>No members</div>';
}

function setAggTab(t) {
  AGG_TAB = t;
  ['person','category','location','date'].forEach(x => { const el = $('tab-' + x); if (el) el.classList.toggle('active', x === t); });
  renderSummary();
}
function renderSummary() {
  if (!EXPENSES.length) { $('aggContent').innerHTML = '<div class="empty"><i class="ti ti-chart-bar"></i>No expenses yet</div>'; return; }
  let html = '';
  if (AGG_TAB === 'person') {
    const {po} = calcTotals(); const byP = {};
    EXPENSES.forEach(e => { byP[e.paidBy] = (byP[e.paidBy] || 0) + e.amount; });
    html = MEMBERS.map((m, i) => {
      const sp = byP[m.id] || 0; const p = po[m.id] || {owed:0,paid:0}; const ow = p.owed - p.paid;
      return '<div class="card"><div class="row-between">' +
        '<div class="flex-row" style="gap:9px">' + avatar(m.name, i) + '<span style="font-weight:600">' + esc(m.name) + '</span></div>' +
        '<div style="text-align:right;font-size:13px"><div>Paid out: <strong>' + fmtBase(sp) + '</strong></div>' +
        '<div style="color:' + (ow > 0.005 ? 'var(--red)' : 'var(--green)') + '">Owes: <strong>' + (ow > 0.005 ? fmtBase(ow) : 'Nothing') + '</strong></div></div>' +
        '</div></div>';
    }).join('');
  }
  if (AGG_TAB === 'category') {
    const cats = {}; EXPENSES.forEach(e => { cats[e.category] = (cats[e.category] || 0) + e.amount; });
    const tot = Object.values(cats).reduce((a,b) => a+b, 0);
    html = Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,a]) => {
      const pct = tot > 0 ? Math.round((a/tot)*100) : 0;
      return '<div class="card"><div class="row-between" style="margin-bottom:6px"><span style="font-weight:600"><i class="ti ' + (CATICON[c]||'ti-dots') + '" style="margin-right:6px;color:var(--text2)"></i>' + c + '</span><span style="font-weight:600">' + fmtBase(a) + ' <span style="color:var(--text2);font-weight:400">(' + pct + '%)</span></span></div><div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div></div>';
    }).join('');
  }
  if (AGG_TAB === 'location') {
    const locs = {}; EXPENSES.forEach(e => { const k = e.location || 'Unspecified'; locs[k] = (locs[k]||0)+e.amount; });
    html = '<div class="card">' + Object.entries(locs).sort((a,b)=>b[1]-a[1]).map(([l,a]) =>
      '<div class="agg-row"><span><i class="ti ti-map-pin" style="color:var(--text2);margin-right:6px"></i>' + esc(l) + '</span><span style="font-weight:600">' + fmtBase(a) + '</span></div>').join('') + '</div>';
  }
  if (AGG_TAB === 'date') {
    const dates = {}; EXPENSES.forEach(e => { const k = e.date || 'No date'; dates[k] = (dates[k]||0)+e.amount; });
    html = '<div class="card">' + Object.entries(dates).sort((a,b)=>a[0].localeCompare(b[0])).map(([d,a]) =>
      '<div class="agg-row"><span><i class="ti ti-calendar" style="color:var(--text2);margin-right:6px"></i>' + d + '</span><span style="font-weight:600">' + fmtBase(a) + '</span></div>').join('') + '</div>';
  }
  $('aggContent').innerHTML = html;
}

function renderChase() {
  const {po} = calcTotals();
  const debtors = MEMBERS.filter(m => (po[m.id]?.owed||0)-(po[m.id]?.paid||0) > 0.01);
  if (!debtors.length) { $('chaseList').innerHTML = '<div class="empty"><i class="ti ti-circle-check" style="color:var(--green);opacity:1"></i>Everyone is settled! 🎉</div>'; return; }
  $('chaseList').innerHTML = debtors.map(m => {
    const p = po[m.id]; const ow = p.owed - p.paid;
    const items = (p.expenses||[]).filter(e => !e.paid && e.amount > 0);
    return '<div class="card">' +
      '<div class="row-between" style="margin-bottom:8px">' +
      '<div class="flex-row" style="gap:10px">' + avatar(m.name, getMIdx(m.id)) + '<div><div style="font-weight:600">' + esc(m.name) + '</div><div style="font-size:12px;color:var(--text2)">' + (m.email||'no email') + ' · ' + (m.wa||'no WhatsApp') + '</div></div></div>' +
      '<div style="font-size:18px;font-weight:700;color:var(--red)">' + fmtBase(ow) + '</div></div>' +
      '<div style="font-size:12px;color:var(--text2);margin-bottom:12px">' + items.map(e => esc(e.desc) + ': ' + fmtBase(e.amount)).join(' · ') + '</div>' +
      '<div class="flex-row" style="flex-wrap:wrap;gap:8px">' +
      '<button class="btn sm" onclick="openChaseMsg(\'' + m.id + '\',\'whatsapp\')"><i class="ti ti-brand-whatsapp"></i> WhatsApp</button>' +
      '<button class="btn sm" onclick="openChaseMsg(\'' + m.id + '\',\'email\')"><i class="ti ti-mail"></i> Email</button>' +
      '</div></div>';
  }).join('');
}

function openChaseMsg(memberId, type) {
  const {po} = calcTotals();
  const m = getMember(memberId);
  const p = po[memberId] || {owed:0,paid:0,expenses:[]};
  const ow = p.owed - p.paid;
  const items = (p.expenses||[]).filter(e => !e.paid && e.amount > 0);
  const lines = items.map(e => '  • ' + e.desc + ': ' + fmtBase(e.amount)).join('\n');
  const trip = T ? T.name : 'our trip';
  const first = m.name.split(' ')[0];
  const msg = type === 'whatsapp'
    ? 'Hi ' + first + '! 👋\n\nJust a friendly nudge about ' + trip + ' — you still have outstanding:\n\n' + lines + '\n\nTotal: ' + fmtBase(ow) + '\n\nPlease let me know once sent. Cheers! 🙏'
    : 'Subject: Payment reminder — ' + trip + '\n\nHi ' + first + ',\n\nFollowing up on outstanding expenses from ' + trip + '.\n\nOutstanding:\n' + lines + '\n\nTotal due: ' + fmtBase(ow) + '\n\nPlease arrange payment when you can.\n\nMany thanks';

  const waLink = (type === 'whatsapp' && m.wa)
    ? '<a href="https://wa.me/' + m.wa.replace(/\D/g,'') + '" target="_blank" rel="noopener" class="btn sm"><i class="ti ti-brand-whatsapp"></i> Open WhatsApp</a>'
    : '';
  const mailLink = (type === 'email' && m.email)
    ? '<a href="mailto:' + m.email + '" class="btn sm"><i class="ti ti-mail"></i> Open mail</a>'
    : '';

  showModal(
    '<div class="modal-handle"></div>' +
    '<div class="modal-title"><i class="ti ti-' + (type === 'whatsapp' ? 'brand-whatsapp' : 'mail') + '"></i> ' + (type === 'whatsapp' ? 'WhatsApp' : 'Email') + ' for ' + esc(m.name) + '</div>' +
    '<div class="chase-box" id="chaseText">' + esc(msg) + '</div>' +
    '<div class="flex-row" style="flex-wrap:wrap;gap:8px;margin-top:10px">' +
    '<button class="btn sm" onclick="copyChase()"><i class="ti ti-copy"></i> Copy</button>' +
    waLink + mailLink + '</div>' +
    '<div class="flex-row" style="justify-content:flex-end;margin-top:12px"><button class="btn" onclick="closeModal()">Close</button></div>'
  );
}
function copyChase() {
  const el = $('chaseText');
  if (el) navigator.clipboard.writeText(el.textContent).then(() => toast('Copied!'));
}

// =============================================================================
// HELPERS
// =============================================================================
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function currencySelect(id, val, onchange) {
  const options = CURRENCIES.map(c => '<option value="' + c + '"' + (c === val ? ' selected' : '') + '>' + c + ' ' + sym(c) + '</option>').join('');
  return '<select id="' + id + '"' + (onchange ? ' onchange="updateFxPreview()"' : '') + '>' + options + '</select>';
}

// =============================================================================
// BOOT
// =============================================================================
document.addEventListener('DOMContentLoaded', function() {
  loadLocal();
  const savedId = localStorage.getItem('te_cur');
  if (savedId) {
    loadTrip(savedId);
  } else if (ALL_TRIPS.length) {
    loadTrip(ALL_TRIPS[0].id);
  } else {
    $('page-setup').classList.add('active');
  }
});
</script>
